          <line x1="88" y1="288" x2="182" y2="288" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="88" y1="288" x2="88" y2="308" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>
          <line x1="182" y1="288" x2="182" y2="308" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>

          <line x1="340" y1="268" x2="340" y2="288" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="293" y1="288" x2="387" y2="288" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="293" y1="288" x2="293" y2="308" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>
          <line x1="387" y1="288" x2="387" y2="308" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>

          <line x1="545" y1="268" x2="545" y2="288" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="498" y1="288" x2="592" y2="288" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="498" y1="288" x2="498" y2="308" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>
          <line x1="592" y1="288" x2="592" y2="308" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>

