<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" style="font-family:'Figtree',sans-serif">
          <title>Claude product ecosystem</title>
          <desc>Hierarchical diagram from Anthropic AI models at the top, through Claude API, to three main interfaces, their key integrations, and the MCP Protocol layer at the base.</desc>
          <defs>
            <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M2 1L8 5L2 9" fill="none" stroke="#B4AFA8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
          </defs>

          <!-- Tier 0: Anthropic -->
          <g>
            <rect x="140" y="44" width="400" height="52" rx="10" fill="#FAECE7" stroke="#C8441C" stroke-width="0.5"/>
            <text x="340" y="64" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#4A1B0C">Anthropic</text>
            <text x="340" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#712B13">Claude AI models · Haiku · Sonnet · Opus</text>
          </g>

          <!-- Connector: T0 → T1 -->
          <line x1="340" y1="96" x2="340" y2="122" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>

          <!-- Tier 1: Claude API -->
          <g>
            <rect x="230" y="122" width="220" height="44" rx="8" fill="#1C1812" stroke="#4A4540" stroke-width="0.5"/>
            <text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#F5F1EA">Claude API</text>
            <text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgba(245,241,234,0.55)">platform.claude.com</text>
          </g>

          <!-- Fan: API → 3 interfaces -->
          <line x1="340" y1="166" x2="340" y2="188" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="135" y1="188" x2="545" y2="188" stroke="#B4AFA8" stroke-width="0.5"/>
          <line x1="135" y1="188" x2="135" y2="208" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>
          <line x1="340" y1="188" x2="340" y2="208" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>
          <line x1="545" y1="188" x2="545" y2="208" stroke="#B4AFA8" stroke-width="0.5" marker-end="url(#arr)"/>

          <!-- Tier 2: Three interfaces -->
          <g>
            <rect x="40" y="208" width="190" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
            <text x="135" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">claude.ai</text>
            <text x="135" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Web &amp; mobile chat</text>
          </g>
          <g>
            <rect x="245" y="208" width="190" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
            <text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Claude Desktop</text>
            <text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">Desktop app · MCP host</text>
          </g>
          <g>
