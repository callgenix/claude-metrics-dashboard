            <text x="88" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Excel</text>
            <text x="88" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">add-in</text>
          </g>
          <g>
            <rect x="138" y="308" width="88" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
            <text x="182" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">PowerPoint</text>
            <text x="182" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">add-in</text>
          </g>
          <g>
            <rect x="249" y="308" width="88" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
            <text x="293" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Cowork</text>
            <text x="293" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">automation</text>
          </g>
          <g>
            <rect x="343" y="308" width="88" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
            <text x="387" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">Chrome</text>
            <text x="387" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">browser agent</text>
          </g>
          <g>
            <rect x="454" y="308" width="88" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
            <text x="498" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">VS Code</text>
            <text x="498" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">IDE ext.</text>
          </g>
          <g>
            <rect x="548" y="308" width="88" height="40" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
            <text x="592" y="324" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#04342C">JetBrains</text>
            <text x="592" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">IDE ext.</text>
          </g>

          <!-- Dashed drops to MCP -->
          <line x1="135" y1="348" x2="135" y2="400" stroke="#B4AFA8" stroke-width="0.5" stroke-dasharray="3 3"/>
          <line x1="340" y1="348" x2="340" y2="400" stroke="#B4AFA8" stroke-width="0.5" stroke-dasharray="3 3"/>
          <line x1="545" y1="348" x2="545" y2="400" stroke="#B4AFA8" stroke-width="0.5" stroke-dasharray="3 3"/>

          <!-- MCP band -->
          <g>
            <rect x="40" y="400" width="600" height="50" rx="8" fill="#EDE8DF" stroke="#8C877E" stroke-width="0.5"/>
            <text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#1C1812">MCP Protocol layer</text>
            <text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#4A4540">Filesystem · Browser · APIs · third-party connectors</text>
          </g>
        </svg>