            <text x="545" y="228" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">Claude Code</text>
            <text x="545" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#3C3489">CLI · agentic coding</text>
          </g>

